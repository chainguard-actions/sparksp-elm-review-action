name: Test elm-review basic success (no errors)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock elm-review (no errors)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/elm-review" << 'SCRIPT'
          #!/bin/sh
          # Mock elm-review: returns a JSON report with no errors
          echo '{"type":"review-errors","errors":[]}'
          exit 0
          SCRIPT
          chmod +x "$HOME/.local/bin/elm-review"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run elm-review action (no errors expected)
        id: action
        uses: .
        with:
          name: 'elm-review-test'
          elm_review: 'elm-review'
        continue-on-error: true

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action calls the GitHub Checks API with the real token.
          # It should succeed (no errors found → creates a success check).
          # If it fails, it should be due to API issues, not a crash.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
