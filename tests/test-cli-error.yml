name: Test elm-review CLI error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock elm-review that returns a CLI error
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/elm-review" << 'SCRIPT'
          #!/bin/sh
          # Mock elm-review: returns a CLI error (e.g. missing elm.json)
          echo '{"type":"error","title":"COULD NOT FIND ELM.JSON","path":"elm.json","message":"I could not find an elm.json file."}'
          exit 1
          SCRIPT
          chmod +x "$HOME/.local/bin/elm-review"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run elm-review action (CLI error expected)
        id: action
        uses: .
        with:
          name: 'elm-review-cli-error'
          elm_review: 'elm-review'
        continue-on-error: true

      - name: Assert action failed due to CLI error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When elm-review returns a CLI error, the action should fail
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail when elm-review returns a CLI error"
            exit 1
          fi
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action correctly reported failure for CLI error (outcome=$OUTCOME)"
