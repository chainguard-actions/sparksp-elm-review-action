name: Test elm_compiler and elm_format inputs pass correct flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock elm-review that captures args
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/elm-review << 'EOF'
          #!/bin/bash
          # Write args to a file for inspection
          echo "$@" > /tmp/elm-review-args.txt
          echo '{"type":"review-errors","errors":[]}'
          exit 0
          EOF
          chmod +x /tmp/mock-bin/elm-review

      - id: action
        uses: .
        with:
          elm_review: /tmp/mock-bin/elm-review
          elm_compiler: /usr/local/bin/elm
          elm_format: /usr/local/bin/elm-format
        continue-on-error: true

      - name: Assert --compiler and --elm-format-path flags were passed
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -f /tmp/elm-review-args.txt ]; then
            ARGS=$(cat /tmp/elm-review-args.txt)
            echo "elm-review args: $ARGS"
            if echo "$ARGS" | grep -q -- '--compiler'; then
              echo "PASS: --compiler flag was passed to elm-review"
            else
              echo "FAIL: --compiler flag was not passed to elm-review"
              exit 1
            fi
            if echo "$ARGS" | grep -q -- '--elm-format-path'; then
              echo "PASS: --elm-format-path flag was passed to elm-review"
            else
              echo "FAIL: --elm-format-path flag was not passed to elm-review"
              exit 1
            fi
          else
            echo "FAIL: elm-review was not called (args file not found)"
            exit 1
          fi
