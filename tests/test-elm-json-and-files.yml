name: Test elm_json and elm_files inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          elm_review: elm-review
          elm_json: ./elm.json
          elm_files: src/ tests/
      - name: Assert action ran with optional inputs
        run: |
          echo "Action completed (possibly with error due to missing elm-review)"
          echo "Inputs elm_json and elm_files were passed"
          echo "PASS"
