name: Test elm_json input passes --elmjson flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock elm-review that captures args
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/elm-review << 'EOF'
          #!/bin/bash
          # Write args to a file for inspection
          echo "$@" > /tmp/elm-review-args.txt
          echo '{"type":"review-errors","errors":[]}'
          exit 0
          EOF
          chmod +x /tmp/mock-bin/elm-review

      - id: action
        uses: .
        with:
          elm_review: /tmp/mock-bin/elm-review
          elm_json: /tmp/my-project/elm.json
        continue-on-error: true

      - name: Assert --elmjson flag was passed to elm-review
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -f /tmp/elm-review-args.txt ]; then
            ARGS=$(cat /tmp/elm-review-args.txt)
            echo "elm-review args: $ARGS"
            if echo "$ARGS" | grep -q -- '--elmjson'; then
              echo "PASS: --elmjson flag was passed to elm-review"
            else
              echo "FAIL: --elmjson flag was not passed to elm-review"
              exit 1
            fi
            if echo "$ARGS" | grep -q '/tmp/my-project/elm.json'; then
              echo "PASS: correct elm.json path was passed"
            else
              echo "FAIL: correct elm.json path was not passed"
              exit 1
            fi
          else
            echo "FAIL: elm-review was not called (args file not found)"
            exit 1
          fi
