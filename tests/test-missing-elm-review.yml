name: Test missing elm-review binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          name: elm-review
          elm_review: /nonexistent/path/to/elm-review
        continue-on-error: true

      - name: Assert action failed when elm-review is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when elm-review binary is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when elm-review binary is not found"
