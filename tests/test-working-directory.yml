name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock elm-review script and a working directory
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/elm-review" << 'EOF'
          #!/bin/bash
          # Mock elm-review: output a success JSON (no errors)
          echo '{"type":"review-errors","errors":[]}'
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/elm-review"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Create a subdirectory to use as working directory
          mkdir -p /tmp/elm-project

      - id: action
        uses: .
        with:
          name: elm-review
          elm_review: "${{ env.HOME }}/.local/bin/elm-review"
          working-directory: /tmp/elm-project
        continue-on-error: true

      - name: Assert action ran with working-directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to GitHub Checks API not being available in act,
          # but it should not fail due to the working-directory input.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with working-directory"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
