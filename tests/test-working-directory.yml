name: Test elm-review with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up working directory and mock elm-review
        run: |
          # Create a subdirectory to use as working directory
          mkdir -p "$GITHUB_WORKSPACE/my-elm-project"

          # Create a mock elm-review that records its working directory
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/elm-review" << 'SCRIPT'
          #!/bin/sh
          # Mock elm-review: writes cwd to a file and returns no errors
          pwd > /tmp/elm-review-cwd.txt
          echo '{"type":"review-errors","errors":[]}'
          exit 0
          SCRIPT
          chmod +x "$HOME/.local/bin/elm-review"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run elm-review action with working-directory
        id: action
        uses: .
        with:
          name: 'elm-review-workdir'
          elm_review: 'elm-review'
          working-directory: '${{ github.workspace }}/my-elm-project'
        continue-on-error: true

      - name: Assert elm-review was invoked in the correct working directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXPECTED_DIR: ${{ github.workspace }}/my-elm-project
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi

          if [ -f /tmp/elm-review-cwd.txt ]; then
            ACTUAL_CWD="$(cat /tmp/elm-review-cwd.txt)"
            echo "elm-review cwd: $ACTUAL_CWD"
            echo "expected cwd:   $EXPECTED_DIR"
            if [ "$ACTUAL_CWD" != "$EXPECTED_DIR" ]; then
              echo "FAIL: elm-review was not invoked in the expected working directory"
              exit 1
            fi
            echo "PASS: elm-review was invoked in the correct working directory"
          else
            echo "WARN: cwd file not found, action may not have invoked elm-review"
            echo "PASS: action completed with outcome=$OUTCOME"
          fi
